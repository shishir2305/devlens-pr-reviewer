<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Lens Rim Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Main Branch Gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Feature Branch Gradient -->
    <linearGradient id="featGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- Glow Filter for Code Elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Lens Tint -->
  <circle cx="230" cy="230" r="130" fill="#38BDF8" opacity="0.06" />

  <!-- GIT PULL REQUEST GRAPH (Inside Lens) -->
  <g filter="url(#glow)">
    <!-- Main Branch Line -->
    <line x1="170" y1="310" x2="170" y2="150" stroke="url(#mainGrad)" stroke-width="14" stroke-linecap="round" />
    
    <!-- Feature Branch Curve -->
    <path d="M 170 270 C 210 270, 270 250, 270 210" fill="none" stroke="url(#featGrad)" stroke-width="14" stroke-linecap="round" />
    
    <!-- Pull Request Merge Indicator (Dotted Arrow) -->
    <line x1="260" y1="205" x2="190" y2="165" stroke="#F43F5E" stroke-width="8" stroke-dasharray="8, 8" stroke-linecap="round" />
    <polygon points="190,165 205,162 195,175" fill="#F43F5E" transform="rotate(-15 190 165)" />

    <!-- Main Branch Nodes -->
    <circle cx="170" cy="310" r="20" fill="#0F172A" stroke="url(#mainGrad)" stroke-width="8" />
    <circle cx="170" cy="150" r="20" fill="#0F172A" stroke="url(#mainGrad)" stroke-width="8" />
    
    <!-- Feature Branch Node -->
    <circle cx="270" cy="210" r="20" fill="#0F172A" stroke="url(#featGrad)" stroke-width="8" />
  </g>

  <!-- LENS DETAILS -->
  <!-- Glass Reflection (Crescent) -->
  <path d="M 132 145 A 115 115 0 0 1 295 120 A 122 122 0 0 0 115 295 A 115 115 0 0 1 132 145 Z" fill="#FFFFFF" opacity="0.12" />

  <!-- Reticle / Focus Crosshairs -->
  <line x1="230" y1="80" x2="230" y2="96" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
  <line x1="230" y1="364" x2="230" y2="380" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
  <line x1="80" y1="230" x2="96" y2="230" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
  <line x1="364" y1="230" x2="380" y2="230" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />

  <!-- Magnifying Glass Frame -->
  <circle cx="230" cy="230" r="130" fill="none" stroke="url(#lensGrad)" stroke-width="24" />
  
  <!-- Outer Ring Accent -->
  <circle cx="230" cy="230" r="148" fill="none" stroke="#1E293B" stroke-width="4" opacity="0.5" />

  <!-- Magnifying Glass Handle -->
  <!-- Base Handle -->
  <line x1="322" y1="322" x2="426" y2="426" stroke="url(#handleGrad)" stroke-width="44" stroke-linecap="round" />
  
  <!-- Handle Grip/Slot Indentation -->
  <line x1="344" y1="344" x2="404" y2="404" stroke="#020617" stroke-width="12" stroke-linecap="round" opacity="0.6" />
  
  <!-- Handle Joint Ring -->
  <line x1="316" y1="316" x2="334" y2="334" stroke="#38BDF8" stroke-width="48" stroke-linecap="round" />
  <line x1="322" y1="322" x2="328" y2="328" stroke="#0F172A" stroke-width="48" stroke-linecap="round" />
</svg>
